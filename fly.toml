app = 'fjcabello-apple-health-mcp'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "apple_health_data"
  destination = "/data"

[[vm]]
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
