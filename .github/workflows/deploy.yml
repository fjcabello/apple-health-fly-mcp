name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

# The job only needs to read the code; the GITHUB_TOKEN gets nothing else.
permissions:
  contents: read

# One deploy at a time; a newer push waits instead of racing the running one.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Add a required reviewer to this environment (Settings → Environments) and
    # keep FLY_API_TOKEN there, so every deploy waits for your approval.
    environment: production
    steps:
      # Third-party actions are pinned to a commit: a moved tag or branch
      # cannot swap in new code that would receive FLY_API_TOKEN.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
      - run: flyctl deploy --ha=false --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
